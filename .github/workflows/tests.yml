name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff==0.17.0

      - name: Check code
        run: python -m ruff check backend backend_tests scripts

      - name: Check formatting
        run: python -m ruff format --check backend backend_tests scripts

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_HOST: "127.0.0.1"
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: vkr_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: ci_test_password

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-test.txt

      - name: Prepare test database
        run: python scripts/prepare_test_db.py --psql-container ${{ job.services.postgres.id }}

      - name: Run tests
        run: python -m pytest backend_tests -v --junitxml=reports/pytest.xml

      - name: Save pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 7
